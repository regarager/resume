name: Build Resume PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Build PDFs
        run: |
          mkdir -p dist
          typst compile main.typ dist/main.pdf
          typst compile main.typ dist/Redger_Xu_Resume.pdf
          typst compile main.typ "dist/Redger_Xu_Resume-$(date -u +%m-%d-%Y).pdf"

      - name: Set release tag
        id: release
        run: echo "tag=v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: dist/*.pdf
          if-no-files-found: error

      - name: Create release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Resume ${{ steps.release.outputs.tag }}
          files: dist/*.pdf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
