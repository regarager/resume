name: Build Resume PDFs

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Build PDFs
        run: |
          mkdir -p dist
          typst compile main.typ dist/main.pdf
          typst compile main.typ dist/Redger_Xu_Resume.pdf
          typst compile main.typ "dist/Redger_Xu_Resume-$(date -u +%m-%d-%Y).pdf"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: dist/*.pdf
          if-no-files-found: error

      - name: Upload PDFs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.pdf
